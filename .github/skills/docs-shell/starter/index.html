<!DOCTYPE html>
<!--
  ===========================================================================
  docs-shell STARTER  (byte-identical baseline of the root shell)
  ---------------------------------------------------------------------------
  This is the adopter-facing copy of the docs-shell pattern. Drop this
  folder (index.html + manifest.json + about.md) into your project's docs
  directory and open index.html. No build step, no server required for
  Copilot's internal browser or VS Code Simple Browser.

  QUICK ADOPTION
    1. Copy the three starter files into your destination folder.
    2. Edit manifest.json (change brand.label, add your docs[]).
    3. Optionally drop a brand icon at assets/<name>.svg and uncomment the
       <img class="topnav-brand-icon"> line in <body> below.
    4. Open index.html.

  Full field-by-field reference for the manifest schema, theme system,
  path rewriting, optional features, and troubleshooting lives at:
    https://github.com/fabioc-aloha/Alex_ACT_Illustrator_Plugin/blob/main/docs/shell/README.md

  ARCHITECTURE (this file)
    Load manifest → pick area+doc from URL (?area=X&doc=Y) → render topnav
    (line 1 = areas, line 2 = docs of active area) → render page-title with
    per-doc emoji → render hero → fetch + strip + concat source .md → parse
    via marked → decorate (heading anchors, tables, alerts, code blocks,
    mermaid) → build TOC.

  MANIFEST SCHEMA (top-level keys the shell reads)
    brand.{label, href}                    Brand slot label + link (line 1)
    theme.{light, dark}                    Optional CSS-var overrides
    defaultArea                            Fallback area id
    areas[].{id, label, folder,            Line-1 area buttons
            defaultDoc, docs[]}
    areas[].docs[].{id, label,             Line-2 doc buttons
                    icon?, title,          icon = optional emoji shown in
                    verified?,             sticky page-title header
                    hero?, sources[]}

  PER-DOC HERO FIELDS
    hero.eyebrow                           Small uppercase tag above title
    hero.title                             Big display heading
    hero.subtitle                          One-sentence Big Idea (renders as
                                           <span> under the title). Authored
                                           via the big-idea skill.
    hero.description                       Optional metadata: provenance,
                                           cross-refs, methodology notes.
                                           NOT rendered by default (retired
                                           2026-07-28 once Big Idea took
                                           over summary duty). Kept in
                                           manifest for adopters who want
                                           to re-enable, and for potential
                                           future indexing / search use.

  OPTIONAL FEATURES available to adopters
    - Per-doc emoji icon: add `icon` to a doc entry.
    - Manifest theme override: add `theme.{light|dark}` maps.
    - Top-nav quick-jumps: keep manifest `quickJumps[]` and re-enable the
      rendering block in renderTopnav() (currently commented out).
    - Hero chips + CTAs: reserved CSS is present; add `hero.chips[]` /
      `hero.actions[]` to a doc and extend renderHero().
    - Brand icon: uncomment the <img class="topnav-brand-icon"> line in
      the <body> topnav and drop an SVG at assets/<name>.svg.

  LOCAL RENDERING
    file:// works with Copilot's internal browser and VS Code Simple Browser.
    External browsers need a local HTTP server (see error message in
    showFileAccessError() below for exact commands).
  ===========================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs Shell Starter</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
  <style>
    @view-transition {
      navigation: auto;
    }

    :root {
      --fg: #1f2328;
      --fg-muted: #59636e;
      --fg-subtle: #818b98;
      --bg: #ffffff;
      --bg-subtle: #f6f8fa;
      --bg-elevated: #ffffff;
      --border: #d1d9e0;
      --border-muted: #d1d9e0b3;
      --accent: #0969da;
      --accent-emphasis: #0550ae;
      --accent-fg: #ffffff;
      --success: #1a7f37;
      --success-emphasis: #116329;
      --success-bg: #dafbe1;
      --success-border: #b7f0c2;
      --attention: #9a6700;
      --attention-emphasis: #7d4e00;
      --attention-bg: #fff8c5;
      --attention-border: #f1c40f80;
      --danger: #d1242f;
      --danger-emphasis: #a40e26;
      --danger-bg: #ffebe9;
      --danger-border: #ff818266;
      --note-bg: #ddf4ff;
      --note-border: #54aeff80;
      --purple: #8250df;
      --purple-bg: #fbefff;
      --github-dark: #24292f;
      --code-bg: #f6f8fa;
      --mermaid-bg: #fbfcfd;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 3px 12px rgba(15, 23, 42, 0.08);
      --radius: 6px;
      --radius-lg: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #f0f6fc;
        --fg-muted: #9198a1;
        --fg-subtle: #6e7681;
        --bg: #0d1117;
        --bg-subtle: #151b23;
        --bg-elevated: #161b22;
        --border: #30363d;
        --border-muted: #30363dcc;
        --accent: #4493f8;
        --accent-emphasis: #1f6feb;
        --success: #3fb950;
        --success-emphasis: #56d364;
        --success-bg: #0b2a1a;
        --success-border: #1f6c3555;
        --attention: #d29922;
        --attention-emphasis: #e6b644;
        --attention-bg: #2e1f00;
        --attention-border: #d2992255;
        --danger: #f85149;
        --danger-emphasis: #ff7b72;
        --danger-bg: #2b0f10;
        --danger-border: #f8514955;
        --note-bg: #0d2f4f;
        --note-border: #1f6feb55;
        --purple: #a371f7;
        --purple-bg: #211036;
        --github-dark: #010409;
        --code-bg: #151b23;
        --mermaid-bg: #151b23;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 3px 12px rgba(0, 0, 0, 0.6);
      }
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      /* Offset anchor jumps by the actual measured two-row nav height (set via
         --nav-height at bootstrap + on resize) plus a fixed page-header allowance.
         Fallback covers the initial paint before JS runs. */
      scroll-padding-top: calc(var(--nav-height, 78px) + 60px);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI",
                   "Noto Sans", Helvetica, Arial, sans-serif,
                   "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 16px;
      line-height: 1.6;
      color: var(--fg);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .skip-link {
      position: fixed;
      top: 0.5rem;
      left: 0.75rem;
      z-index: 100;
      padding: 0.5rem 0.75rem;
      color: #0d1117;
      background: #f0f6fc;
      border-radius: var(--radius);
      font-weight: 600;
      text-decoration: none;
      transform: translateY(-200%);
      transition: transform 0.15s ease;
    }
    .skip-link:focus { transform: translateY(0); }

    /* ---------- Sticky page header ---------- */

    /* ---------- Top nav bar (cross-document + quick-jumps) ---------- */

    nav.topnav {
      position: sticky;
      top: 0;
      z-index: 30;
      view-transition-name: topnav;
      background: #0d1117;
      color: #f0f6fc;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.4rem 1.25rem;
      font-size: 0.8125rem;
    }
    nav.topnav .topnav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    nav.topnav .topnav-brand {
      color: #f0f6fc;
      font-weight: 600;
      text-decoration: none;
      padding: 0.25rem 0.6rem 0.25rem 0;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      margin-right: 0.5rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    nav.topnav .topnav-brand:hover { color: #58a6ff; }
    nav.topnav .topnav-brand-icon {
      height: 22px;
      width: 22px;
      flex-shrink: 0;
      display: block;
    }
    nav.topnav .topnav-list {
      display: flex;
      gap: 0.15rem;
      row-gap: 0.3rem;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
    nav.topnav .topnav-jumps { margin-left: auto; opacity: 0.9; }
    nav.topnav .topnav-sub {
      max-width: 1400px;
      margin: 0.35rem auto 0;
      padding-top: 0.35rem;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    nav.topnav .topnav-areas a[data-nav] { font-weight: 600; }
    nav.topnav .topnav-sub .topnav-docs a[data-nav] { font-size: 0.78125rem; }
    /* Reserve two rows so areas whose docs fit on one line have the same navbar
       height as areas that wrap. Prevents view-transition-name:topnav from morphing
       a height delta between pages. */
    nav.topnav .topnav-docs { min-height: 2.75rem; align-content: center; }
    nav.topnav a[data-nav] {
      color: #9198a1;
      text-decoration: none;
      padding: 0.3rem 0.7rem;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
    }
    nav.topnav a[data-nav]:hover { background: rgba(255, 255, 255, 0.06); color: #f0f6fc; }
    nav.topnav a[data-nav].active { background: rgba(88, 166, 255, 0.15); color: #58a6ff; font-weight: 600; }
    nav.topnav a:focus-visible,
    header.page a:focus-visible {
      outline: 2px solid #58a6ff;
      outline-offset: 2px;
    }
    /* OPTIONAL FEATURE: line-1 quick-jumps to specific doc sections.
       Not currently rendered by this shell (see renderTopnav below), but the
       manifest still declares `quickJumps` per area and the starter kit at
       .github/skills/docs-shell/starter/ uses this styling. Kept so adopters
       can re-enable rendering without also having to restore CSS. */
    nav.topnav .topnav-jumps a[data-nav] { font-size: 0.78125rem; padding: 0.2rem 0.5rem; }

    header.page {
      position: sticky;
      top: var(--nav-height, 78px);
      z-index: 20;
      background: linear-gradient(135deg, var(--github-dark) 0%, #1f2937 100%);
      color: #f0f6fc;
      padding: 0.9rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow-sm);
      backdrop-filter: saturate(140%);
    }
    header.page .inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header.page h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    header.page h1 .page-title-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      font-size: 1.15rem;
      line-height: 1;
      font-style: normal;
      /* Emoji fonts render best with these hints */
      font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    }
    header.page h1 .page-title-icon:empty { display: none; }
    header.page .meta {
      font-size: 0.8125rem;
      color: #9198a1;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header.page .verified {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    header.page .verified::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(63, 185, 80, 0.15);
    }

    /* ---------- Hero banner ---------- */

    section.hero {
      position: relative;
      background:
        radial-gradient(1200px 500px at 15% 0%, rgba(9, 105, 218, 0.14), transparent 60%),
        radial-gradient(900px 400px at 90% 100%, rgba(130, 80, 223, 0.13), transparent 60%),
        linear-gradient(180deg, #f6f8fa 0%, #ffffff 100%);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      section.hero {
        background:
          radial-gradient(1200px 500px at 15% 0%, rgba(88, 166, 255, 0.16), transparent 60%),
          radial-gradient(900px 400px at 90% 100%, rgba(163, 113, 247, 0.14), transparent 60%),
          linear-gradient(180deg, #010409 0%, #0d1117 100%);
      }
    }
    section.hero::before {
      /* Subtle grid pattern overlay */
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, var(--border-muted) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-muted) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.35;
      mask-image: radial-gradient(ellipse at center, black 50%, transparent 100%);
      pointer-events: none;
    }
    .hero-inner {
      position: relative;
      max-width: 1400px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem 3rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 3rem;
      align-items: center;
    }
    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; padding: 2.5rem 1.25rem 2rem; }
    }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-emphasis);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      margin-bottom: 1.25rem;
    }
    .hero-eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
    .hero-title {
      font-size: 2.75rem;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1.1;
      margin: 0 0 0.75rem;
      color: var(--fg);
    }
    .hero-title .hero-title-sub {
      color: var(--fg-muted);
      font-weight: 400;
      display: block;
      font-size: 0.7em;
      margin-top: 0.25em;
      letter-spacing: 0;
    }
    .hero-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    /* OPTIONAL FEATURE: hero meta-chips. Reserved CSS; not rendered by
       renderHero() today. To enable per-doc, add `hero.chips[]` in the manifest
       and extend renderHero() to inject `<div class="hero-chips">` + child
       `<span class="chip">...</span>` elements. Useful for tags like read-time,
       version, or status pills. */
    .chip {
      display: inline-flex;
      align-items: baseline;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.8125rem;
      color: var(--fg-muted);
      box-shadow: var(--shadow-sm);
    }
    .chip strong {
      color: var(--fg);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    /* OPTIONAL FEATURE: hero CTA buttons. Reserved CSS; not rendered by
       renderHero() today. To enable per-doc, add `hero.actions[]` in the
       manifest (each entry: {label, href, primary?}) and extend renderHero()
       to inject `<div class="hero-actions">` + `<a class="btn">` / `.btn-primary`. */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--fg);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none !important;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s, background 0.15s, border-color 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--fg-muted);
    }
    .btn:active { transform: translateY(0); }
    .btn.btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .btn.btn-primary:hover {
      background: var(--accent-emphasis);
      border-color: var(--accent-emphasis);
    }
    .btn.btn-primary::after {
      content: "→";
      transition: transform 0.15s;
    }
    .btn.btn-primary:hover::after { transform: translateX(3px); }

    /* ---------- Rendered markdown: typography ---------- */

    .layout {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 2.5rem;
      padding: 2rem 1.5rem 4rem;
      transition: grid-template-columns 0.2s ease, gap 0.2s ease;
    }
    .layout.toc-collapsed {
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 1.25rem;
    }
    /* ---------- TOC sidebar ---------- */

    nav.toc {
      position: sticky;
      /* --sticky-offset is published by JS at bootstrap + on window resize as the combined
         height of the sticky topnav and the sticky page-title header. Fallback covers first paint. */
      top: calc(var(--sticky-offset, 8rem) + 0.5rem);
      align-self: start;
      max-height: calc(100vh - var(--sticky-offset, 8rem) - 1rem);
      overflow-y: auto;
      padding: 1rem 0.5rem;
      font-size: 0.875rem;
    }
    .toc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0 0 0.75rem 0;
      padding: 0 0.25rem 0 0.5rem;
    }
    nav.toc h2 {
      margin: 0;
      font-size: 0.6875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-subtle);
      border: none;
      padding: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #toc-toggle {
      flex: 0 0 auto;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg-muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    #toc-toggle:hover { background: var(--bg-subtle); color: var(--accent); border-color: var(--accent); }
    #toc-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .layout.toc-collapsed nav.toc { padding: 1rem 0.15rem; }
    .layout.toc-collapsed nav.toc h2,
    .layout.toc-collapsed nav.toc ol { display: none; }
    .layout.toc-collapsed .toc-header { justify-content: center; margin-bottom: 0; padding: 0; }
    nav.toc ol {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    nav.toc li { margin: 1px 0; }
    nav.toc li.h3 a { padding-left: 1.6rem; font-size: 0.8125rem; color: var(--fg-muted); }
    nav.toc a {
      color: var(--fg);
      text-decoration: none;
      display: block;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      border-left: 2px solid transparent;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    nav.toc a:hover {
      background: var(--bg-subtle);
      color: var(--accent);
    }
    nav.toc a.active {
      background: var(--bg-subtle);
      color: var(--accent-emphasis);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 1100px) {
      .layout, .layout.toc-collapsed { grid-template-columns: 1fr; gap: 1rem; }
      nav.toc {
        position: static;
        top: auto;
        align-self: stretch;
        max-height: 360px;
        overflow-y: auto;
      }
      .layout.toc-collapsed nav.toc {
        max-height: none;
        overflow: visible;
      }
    }

    main { min-width: 0; }

    /* ---------- Rendered markdown: typography ---------- */

    #content {
      line-height: 1.65;
      min-width: 0;
      overflow-x: clip;
      overflow-wrap: anywhere;
    }

    #content h1, #content h2, #content h3, #content h4, #content h5, #content h6 {
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
      scroll-margin-top: 5rem;
    }
    #content h1 { display: none; }

    #content h2 {
      font-size: 1.65rem;
      margin: 3rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    /* First h2 gets less top margin */
    #content > h2:first-of-type { margin-top: 0.5rem; }

    #content h3 {
      font-size: 1.25rem;
      margin: 2rem 0 0.75rem;
      color: var(--fg);
    }
    #content h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }

    #content p { margin: 0 0 1rem; }

    #content a { color: var(--accent); text-decoration: none; }
    #content a:hover { text-decoration: underline; }
    #content a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    #content ul, #content ol {
      padding-left: 1.75rem;
      margin: 0 0 1rem;
    }
    #content li { margin: 0.25rem 0; }
    #content li > p { margin: 0 0 0.5rem; }
    #content li > p:last-child { margin: 0; }

    #content strong { font-weight: 600; }

    /* ---------- Inline code + code blocks ---------- */

    #content code {
      font-family: "Cascadia Code", "SF Mono", "Menlo", Consolas, "Liberation Mono", monospace;
      font-size: 0.85em;
      padding: 0.15em 0.4em;
      background: var(--code-bg);
      border-radius: 4px;
      color: var(--fg);
      border: 1px solid var(--border-muted);
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    #content pre {
      position: relative;
      background: var(--code-bg);
      border-radius: var(--radius);
      padding: 1rem;
      overflow-x: auto;
      line-height: 1.5;
      border: 1px solid var(--border-muted);
      margin: 0 0 1rem;
    }
    #content pre code {
      background: transparent;
      padding: 0;
      border: none;
      font-size: 0.8125rem;
      color: inherit;
      overflow-wrap: normal;
      word-break: normal;
    }
    /* Copy button on hover */
    #content pre .copy-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      font-family: inherit;
      color: var(--fg-muted);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s;
    }
    #content pre:hover .copy-btn { opacity: 1; }
    #content pre:focus-within .copy-btn { opacity: 1; }
    #content pre .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    #content pre .copy-btn.copied { color: var(--success); border-color: var(--success); }

    /* ---------- Blockquotes and GFM alerts ---------- */

    #content blockquote {

      border-left: 4px solid var(--border);
      background: var(--bg-subtle);
      border-radius: 0 var(--radius) var(--radius) 0;

    #content blockquote > p:last-child { margin-bottom: 0; }

    #content blockquote.alert {
      padding-left: 1.25rem;
      border-left-width: 4px;

    #content blockquote.alert-warning {
      border-left-color: var(--attention);
      background: var(--attention-bg);
      color: var(--attention-emphasis);
    }
    #content blockquote.alert-note {
      border-left-color: var(--accent);
      background: var(--note-bg);
      color: var(--accent-emphasis);
    }
    #content blockquote.alert-tip {
      border-left-color: var(--success);
      background: var(--success-bg);
      color: var(--success-emphasis);

    #content blockquote.alert-danger {

      background: var(--danger-bg);
      color: var(--danger-emphasis);

    #content .table-wrap {

    /* ---------- Loading and error states ---------- */

    #content .loading {

  <script>
    /* Synchronous topnav / page-title / hero pre-hydrate.
       MPA cross-document view transitions (@view-transition { navigation: auto }) snapshot the
       incoming document at first paint. The async loader below fetches manifest.json before it
       can populate the nav, title, and hero, so the incoming snapshot would otherwise show them
       all empty — producing a disappear/redraw flash on every navigation. This block reads a
       sessionStorage cache of the manifest (written by loadManifest() after fetch) and paints
       those regions synchronously, so the view-transition captures populated content that
       matches the outgoing page and cross-fades cleanly on the active-item / title change.
       Placed AFTER </section> above so #page-title and #hero-* have been parsed before this
       script runs. Cold cache (first navigation of a session) still flashes once; every
       subsequent navigation is smooth. Kept intentionally dependency-free — no reliance on
       renderTopnav / renderPageHeader / renderHero or their helpers, so adopters can rewrite
       those without also rewriting this block. */
    (function preHydrateShell() {
      try {
        var raw = sessionStorage.getItem('docsshell.manifest.v1');
        if (!raw) return;
        var m = JSON.parse(raw);
        if (!m || !Array.isArray(m.areas) || !m.areas.length) return;

        var esc = function (s) {
          return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        };

        var p = new URLSearchParams(location.search);
        var areaId = p.get('area');
        var docId = p.get('doc');

        var area = null, doc = null;
        if (areaId) area = m.areas.find(function (a) { return a.id === areaId; });
        if (area && docId) doc = area.docs.find(function (d) { return d.id === docId; });
        if (area && !doc) doc = area.docs.find(function (d) { return d.id === area.defaultDoc; }) || area.docs[0];
        if (!area && docId) {
          for (var i = 0; i < m.areas.length; i++) {
            var d2 = m.areas[i].docs.find(function (x) { return x.id === docId; });
            if (d2) { area = m.areas[i]; doc = d2; break; }
          }
        }
        if (!area) {
          area = m.areas.find(function (a) { return a.id === m.defaultArea; }) || m.areas[0];
          doc = area.docs.find(function (d) { return d.id === area.defaultDoc; }) || area.docs[0];
        }
        if (!area || !doc) return;

        var brand = document.getElementById('topnav-brand');
        if (brand && m.brand) {
          var label = brand.querySelector('.topnav-brand-label');
          if (label && m.brand.label) label.textContent = m.brand.label;
          if (m.brand.href) brand.href = m.brand.href;
        }

        var areasEl = document.getElementById('topnav-areas');
        if (areasEl) {
          areasEl.innerHTML = m.areas.map(function (a) {
            return '<li><a href="?area=' + encodeURIComponent(a.id) +
              '" data-nav data-area="' + esc(a.id) + '"' +
              (a.id === area.id ? ' class="active" aria-current="page"' : '') + '>' +
              esc(a.label) + '</a></li>';
          }).join('');
        }

        var isHtmlDoc = function (d) {
          return Boolean(d && Array.isArray(d.sources) && d.sources.length &&
            d.sources.every(function (s) { return s.toLowerCase().endsWith('.html'); }));
        };
        var docsEl = document.getElementById('topnav-docs');
        if (docsEl) {
          docsEl.innerHTML = area.docs.map(function (d) {
            var href = isHtmlDoc(d)
              ? d.sources[0]
              : '?area=' + encodeURIComponent(area.id) + '&doc=' + encodeURIComponent(d.id);
            return '<li><a href="' + esc(href) + '" data-nav data-doc="' + esc(d.id) + '"' +
              (d.id === doc.id ? ' class="active" aria-current="page"' : '') + '>' +
              esc(d.label) + '</a></li>';
          }).join('');
        }

        var titleText = doc.title || doc.label || '';
        if (titleText) document.title = titleText;
        var titleLabel = document.querySelector('#page-title .page-title-label');
        if (titleLabel) titleLabel.textContent = titleText;
        var titleIcon = document.getElementById('page-title-icon');
        if (titleIcon) titleIcon.textContent = doc.icon || '';
        var verified = document.getElementById('page-verified');
        if (verified) {
          verified.textContent = doc.verified || '';
          verified.hidden = !doc.verified;
          if (verified.parentElement) verified.parentElement.hidden = !doc.verified;
        }

        var hero = doc.hero;
        var heroEl = document.getElementById('hero');
        if (heroEl) {
          if (!hero) {
            heroEl.style.display = 'none';
          } else {
            heroEl.style.display = '';
            var eyebrow = document.getElementById('hero-eyebrow');
            if (eyebrow) eyebrow.textContent = hero.eyebrow || '';
            var heroTitle = document.getElementById('hero-title');
            if (heroTitle) {
              // Matches renderHero's contract: title inline + optional subtitle span.
              heroTitle.innerHTML = esc(hero.title || '') +
                (hero.subtitle ? '<span class="hero-title-sub">' + esc(hero.subtitle) + '</span>' : '');
            }
          }
        }
      } catch (_) {
        // Cache corrupt or DOM unavailable — the async loader below will render normally.
      }
    })();
  </script>

<script>
